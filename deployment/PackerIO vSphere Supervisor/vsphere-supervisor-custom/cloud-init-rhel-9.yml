#cloud-config
# Cloud-init bootstrap data for RHEL 9.6 VM template
# Used by the vsphere-supervisor builder for initial VM customization 

ssh_authorized_keys:
  - ""

users:
  - name: packer
    groups: wheel
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false
    passwd: "$6$rounds=4096$salt$hashedpassword"  # default: packer

chpasswd:
  list: |
    packer:packer
  expire: false

ssh_pwauth: true

package_update: false
package_upgrade: false

write_files:
  - path: /etc/dnf/dnf.conf
    content: |
      [main]
      gpgcheck=1
      installonly_limit=3
      clean_requirements_on_remove=True
      best=False
      skip_if_unavailable=True
      max_parallel_downloads=10

runcmd:
  - systemctl restart sshd